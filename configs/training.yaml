# HieraticAI Training Configuration

# Model Configuration
model:
  name: "COCO-Detection/faster_rcnn_R_50_FPN_3x.yaml"
  weights: "COCO-Detection/faster_rcnn_R_50_FPN_3x.yaml"
  num_classes: 95  # Active Gardiner categories in pWestcar (of 634 registered)

# Dataset Configuration
dataset:
  name: "hieratic"
  path: "./dataset_clean"  # Generated by Colab notebook
  train_split: "train"
  val_split: "val"
  test_split: "test"
  category_offset: 0  # Already 0-based after remapping in notebook

# Spatial Split Configuration
split:
  method: "y_band"  # Contiguous Y-bands with buffer gaps
  train_y_max: 1325  # Train: centroid Y <= 1325
  val_y_max: 1480    # Val: centroid Y in (1355, 1480]
  buffer_px: 30      # Buffer gap between zones (signs excluded)
  # Test: centroid Y > 1510
  # Train: 455 signs (75%), Val: 67 signs (11%), Test: 58 signs (10%)
  # Buffer-excluded: 25 signs

# Training Parameters
training:
  batch_size: 2
  num_workers: 4
  learning_rate: 0.0002
  max_iter: 30000
  lr_scheduler: "WarmupCosineLR"
  eval_period: 10000
  checkpoint_period: 10000
  warmup_iters: 1000
  warmup_factor: 0.001
  freeze_at: 2  # Freeze res1 and res2; let res3+ fine-tune on papyrus textures
  sampler: "RepeatFactorTrainingSampler"  # Oversample rare categories
  repeat_threshold: 0.3

# Anchor Configuration (tuned for small hieroglyphic signs)
anchors:
  sizes: [16, 32, 64, 128, 256]  # Shifted smaller vs COCO defaults [32,64,128,256,512]
  aspect_ratios: [0.5, 1.0, 2.0]

# Data Augmentation
augmentation:
  horizontal_flip: 0.5
  vertical_flip: 0.3
  rotation_angle: 15.0
  brightness: [0.6, 1.4]
  contrast: [0.6, 1.4]
  saturation: [0.6, 1.4]
  random_extent_scale: [0.7, 1.3]
  random_extent_shift: [0.2, 0.2]
  min_size_train: [400, 480, 512, 560, 640]
  max_size_train: 800

# Validation
validation:
  confidence_threshold: 0.3
  nms_threshold: 0.5
  max_detections_per_image: 100

# Output Configuration
output:
  base_dir: "./model"
  save_predictions: true
  save_visualizations: true
  export_format: ["json", "csv"]

# Logging
logging:
  level: "INFO"
  log_file: "training.log"
  tensorboard: true
  wandb: false
